<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedido - Delivery Dona Ju</title>
</head>
<body>
    <h1>Fazer pedido</h1>

    <form action="/pedidos" method="post">
        <fieldset>
            <legend>Seus dados</legend>
            <p>
                <label for="nome">Nome</label>
                <input type="text" id="nome" name="nome" required>
            </p>
            <p>
                <label for="telefone">Telefone com DDD (só números)</label>
                <input type="tel" id="telefone" name="telefone" pattern="[0-9]{10,11}" required>
            </p>
        </fieldset>

        <fieldset>
            <legend>Entrega</legend>
            <p>
                <label for="bairro">Bairro</label>
                <select id="bairro" name="bairro" required>
                    <option value="">Escolha o bairro</option>
                    <option value="rio-vermelho">Rio Vermelho (taxa R$ 5,00)</option>
                    <option value="barra">Barra (taxa R$ 6,00)</option>
                    <option value="pituba">Pituba (taxa R$ 7,00)</option>
                    <option value="itapua">Itapuã (taxa R$ 9,00)</option>
                </select>
            </p>
            <p>
                <label for="endereco">Endereço (rua, número e complemento)</label>
                <textarea id="endereco" name="endereco" rows="2" required></textarea>
            </p>
        </fieldset>

        <fieldset>
            <legend>Itens</legend>
            <p>
                <label for="qtd-acaraje">Acarajé (R$ 12,00)</label>
                <input type="number" id="qtd-acaraje" name="itens[acaraje]" min="0" max="20" value="0">
            </p>
            <p>
                <label for="qtd-abara">Abará (R$ 22,00)</label>
                <input type="number" id="qtd-abara" name="itens[abara]" min="0" max="20" value="0">
            </p>
            <p>
                <label for="qtd-moqueca-de-peixe">Moqueca de Peixe (R$ 55,00)</label>
                <input type="number" id="qtd-moqueca-de-peixe" name="itens[moqueca-de-peixe]" min="0" max="20" value="0">
            </p>
            <p>
                <label for="qtd-bobo-de-camarao">Bobó de Camarão (R$ 62,00)</label>
                <input type="number" id="qtd-bobo-de-camarao" name="itens[bobo-de-camarao]" min="0" max="20" value="0">
            </p>
            <p>
                <label for="qtd-manicoba">Maniçoba (R$ 65,00)</label>
                <input type="number" id="qtd-manicoba" name="itens[manicoba]" min="0" max="20" value="0">
            </p>
            <p>
                <label for="qtd-xinxim-de-galinha">Xinxim de Galinha (R$ 70,00)</label>
                <input type="number" id="qtd-xinxim-de-galinha" name="itens[xinxim-de-galinha]" min="0" max="20" value="0">
            </p>
        </fieldset>

        <fieldset>
            <legend>Pagamento</legend>
            <p>
                <label for="pagamento">Forma de pagamento (na entrega)</label>
                <select id="pagamento" name="forma_pagamento" required>
                    <option value="">Escolha</option>
                    <option value="dinheiro">Dinheiro</option>
                    <option value="pix">Pix</option>
                </select>
            </p>
            <p>
                <label for="cupom">Cupom (opcional)</label>
                <input type="text" id="cupom" name="cupom" maxlength="20">
            </p>
        </fieldset>

        <button type="submit">Enviar pedido</button>
    </form>
</body>
</html>
